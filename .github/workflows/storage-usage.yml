name: Upstash storage usage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/storage-usage.yml
      - scripts/upstash-usage.py
      - test/maintenance/test_upstash_usage.py

permissions:
  contents: read

concurrency:
  group: upstash-storage-usage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s test/maintenance -p test_upstash_usage.py -v

  inventory:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read aggregate usage
        run: python3 scripts/upstash-usage.py
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
